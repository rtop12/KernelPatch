name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 ARM64 交叉编译环境
        run: |
          sudo apt update -qq
          sudo apt install -y -qq crossbuild-essential-arm64

      - name: 编译模块
        working-directory: ./code
        run: make -j$(nproc)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mirror_shmem-kpm
          path: ./code/*.kpm
          retention-days: 30
