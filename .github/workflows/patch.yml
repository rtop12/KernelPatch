name: Build KPM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make wget xz-utils

      - name: Download ARM GNU Toolchain
        id: toolchain
        run: |
          TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/gcc-arm-13.2.rel1-x86_64-aarch64-none-elf.tar.xz"
          wget -q "$TOOLCHAIN_URL"
          tar -xf gcc-arm-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          echo "PATH=$PWD/gcc-arm-13.2.rel1-x86_64-aarch64-none-elf/bin:$PATH" >> $GITHUB_ENV

      - name: Build inside code folder
        working-directory: ./code
        run: |
          make -j$(nproc)

      - name: Upload KPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpm-output
          path: |
            ./code/*.kpm
          retention-days: 30
