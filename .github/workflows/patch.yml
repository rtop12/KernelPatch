name: Build KPM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install make
        run: sudo apt update && sudo apt install -y make

      - name: Get aarch64-none-elf gcc
        uses: lawkai-vivo/aarch64-none-elf-gcc-action@v1
        with:
          release: "13.2.Rel1"

      - name: Verify compiler
        run: aarch64-none-elf-gcc --version

      - name: Build
        working-directory: ./code
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-output
          path: ./code/*.kpm
