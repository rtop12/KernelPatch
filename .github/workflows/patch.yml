name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget golang

      - name: Build kpmbuild from source
        run: |
          git clone https://github.com/bmax121/kpmbuild.git
          cd kpmbuild
          go build -o ../kpmbuild ./cmd/kpmbuild
          cd ..
          chmod +x ./kpmbuild

      - name: Build kpm
        run: ./kpmbuild build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-output
          path: build/*.kpm
          retention-days: 30
