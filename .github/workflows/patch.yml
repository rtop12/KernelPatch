name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget tar make bc libelf-dev

      - name: Download aarch64-none-elf toolchain
        run: |
          wget -q https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/13.2.0/x86_64-aarch64-none-elf-gcc-13.2.0.tar.xz
          tar -xf x86_64-aarch64-none-elf-gcc-13.2.0.tar.xz
          echo "$PWD/x86_64-aarch64-none-elf-gcc-13.2.0/bin" >> $GITHUB_PATH

      - name: Fetch KernelPatch (mirror)
        run: |
          rm -rf KernelPatch
          wget -q https://mirror.ghproxy.com/https://github.com/bmax121/KernelPatch/archive/refs/heads/main.tar.gz -O kp.tar.gz
          mkdir -p KernelPatch
          tar -xf kp.tar.gz --strip-components=1 -C ./KernelPatch

      - name: Download Linux kernel headers
        run: |
          wget -q https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
          tar -xf linux-6.6.tar.xz
          cd linux-6.6
          make ARCH=arm64 headers_install INSTALL_HDR_PATH=../linux-hdr

      - name: Build module
        run: |
          make -C ./kpms/mirror_shmem
        env:
          KP_ROOT: $PWD/KernelPatch
          HDR_PATH: $PWD/linux-hdr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror_shmem-kpm
          path: kpms/mirror_shmem/*.kpm
          retention-days: 30
