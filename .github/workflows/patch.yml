name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y make wget xz-utils

      - name: Install aarch64-none-elf gcc
        uses: lawkai-vivo/aarch64-none-elf-gcc-action@v1
        with:
          release: "13.2.Rel1"

      - name: Fetch KernelPatch
        run: |
          wget -q https://github.com/bmax121/KernelPatch/archive/refs/heads/main.tar.gz -O kp.tar.gz
          tar -xf kp.tar.gz
          mv KernelPatch-main KernelPatch

      - name: Debug headers
        run: |
          ls -la
          ls -la ./KernelPatch/kpm/include

      - name: Compile
        run: make -j$(nproc)
        working-directory: ./code

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-output
          path: ./code/*.kpm
          retention-days: 30
