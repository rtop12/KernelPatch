name: Build KPM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y make wget xz-utils

      - name: Setup aarch64‑none‑elf‑gcc
        uses: lawkai‑vivo/aarch64‑none‑elf‑gcc‑action@v1
        with:
          release: "13.2.Rel1"

      - name: Download KernelPatch source code
        run: |
          wget -q https://github.com/bmax121/KernelPatch/archive/refs/heads/main.tar.gz -O kp.tar.gz
          tar -xf kp.tar.gz
          mv KernelPatch-main KernelPatch

      - name: Debug check header files
        run: |
          ls -la
          ls -la ./KernelPatch/kpm/include/

      - name: Compile KPM module
        working‑directory: ./code
        run: make -j$(nproc)

      - name: Upload compiled artifact
        uses: actions/upload‑artifact@v4
        with:
          name: kpm‑output
          path: ./code/*.kpm
          retention‑days: 30
