name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 ARM64 交叉工具链
        run: |
          sudo apt update -qq
          sudo apt install -y -qq crossbuild-essential-arm64 bc

      - name: 下载并安装 Linux 内核头文件
        run: |
          wget -q https://mirror.ghproxy.com/https://github.com/torvalds/linux/archive/refs/tags/v6.6.tar.gz -O linux.tar.gz
          mkdir -p linux-src
          tar -xf linux.tar.gz --strip-components=1 -C ./linux-src
          cd linux-src
          make ARCH=arm64 headers_install INSTALL_HDR_PATH=$PWD/../linux-headers
          echo "KERNEL_HDR=$PWD/../linux-headers/include" >> $GITHUB_ENV

      - name: 编译模块
        working-directory: ./code
        run: make -j$(nproc)
        env:
          KERNEL_HDR: ${{ env.KERNEL_HDR }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mirror_shmem-kpm
          path: ./code/*.kpm
          retention-days: 30
