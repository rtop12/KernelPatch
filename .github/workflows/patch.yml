name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget

      - name: Install kpmbuild
        run: |
          wget -q https://github.com/bmax121/kpmbuild/releases/latest/download/kpmbuild-linux-x86_64 -O kpmbuild
          chmod +x ./kpmbuild

      - name: Build kpm
        run: ./kpmbuild build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-output
          path: build/*.kpm
          retention-days: 30
